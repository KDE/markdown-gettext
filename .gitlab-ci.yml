include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml

variables:
  PYTHON_VERSION: "3.12"

.tox_base:
  image: python:$PYTHON_VERSION
  tags:
    - Linux
  interruptible: true
  before_script:
    - python --version
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install tox
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit-*.xml

imports:
  stage: validate
  extends: .tox_base
  script: tox -e check-imports

python-lint:
  stage: validate
  extends: .tox_base
  script: tox -e lint

build-setuptools:
  stage: build
  image: python:$PYTHON_VERSION
  before_script:
    - python3 --version
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade build
  script:
    - python -m build

# The Scripty host runs an ancient Python 3.8. Ensure compatibility.
build-setuptools-legacy:
  stage: build
  variables:
    PYTHON_VERSION: "3.8"
  image: python:$PYTHON_VERSION
  before_script:
    - python3 --version
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade build
  script:
    - python -m build
